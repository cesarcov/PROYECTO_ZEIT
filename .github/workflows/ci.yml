# Pipeline de integración continua — F-000 / T-06.
#
# OBJ-1: corre en cada push y en cada PR, y bloquea los merges rojos.
# OBJ-2: `gitleaks` falla si aparece un secreto en el diff o en el historial.
# OBJ-3: las migraciones se aplican DESDE CERO sobre un Postgres efímero.
#
# Ninguna credencial vive aquí: la base de datos del CI es un contenedor
# desechable con credenciales de usar y tirar que sólo existen dentro del job.
name: CI

on:
  push:
    branches: [main, staging, "fase-*"]
  pull_request:
    branches: [main, staging]

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Secretos ───────────────────────────────────────────────────────────────
  secretos:
    name: Barrido de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: un secreto viejo sigue siendo un secreto
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + migraciones + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp_ci
          POSTGRES_PASSWORD: erp_ci_efimero
          POSTGRES_DB: erp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Config mínima para que el backend arranque (RN-03). Valores de usar y
      # tirar: viven sólo dentro de este contenedor efímero.
      ENV: development
      DATABASE_URL: postgresql://erp_ci:erp_ci_efimero@localhost:5432/erp_ci
      SECRET_KEY: clave-de-integracion-continua-no-usada-en-ningun-entorno-real
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      GIT_COMMIT: ${{ github.sha }}
      # Credenciales de la suite: existen SÓLO dentro de este job, contra una
      # base de datos que se destruye al terminar. No son secretos.
      TEST_USER: ci_usuario
      TEST_PASSWORD: ci-efimero-usuario
      TEST_ADMIN_USER: ci_admin
      TEST_ADMIN_PASSWORD: ci-efimero-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .
      - name: Esperar a que Postgres esté listo
        run: |
          for i in $(seq 1 30); do
          python -c "import psycopg2; psycopg2.connect('${{ env.DATABASE_URL }}')" 
          echo "Esperando a que Postgres esté listo... intento $i"
          sleep 1
          done

      - name: Migraciones desde cero
        # OBJ-3: si una migración no aplica sobre una base vacía, el CI se pone
        # rojo aquí y no en producción.

        run: python run_migrations.py --strict

      - name: Sembrar usuarios de prueba
        run: python scripts/seed_ci_users.py

      - name: Tests + cobertura
        # OBJ-8: el trinquete de cobertura vive en pyproject.toml (fail_under).
        env:
        TESTING: "true"
        RATE_LIMIT_ENABLED: "false"
      run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: coverage.xml
          if-no-files-found: ignore

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/myapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/myapp/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build
